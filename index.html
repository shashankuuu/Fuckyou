<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknown</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen {
  text-align: center;
  width: 100%;
  padding: 20px;
}

h1 {
  font-size: 25px;
  letter-spacing: 5px;
  font-weight: 300;
  margin-bottom: 18px;
}

.subtitle {
  color: #777;
  font-size: 12px;
  letter-spacing: 3px;
  margin-bottom: 40px;
}

button {
  padding: 15px 45px;
  border: 1px solid #777;
  background: transparent;
  color: white;
  font-size: 14px;
  letter-spacing: 5px;
  cursor: pointer;
  transition: .3s;
}

button:active {
  background: white;
  color: black;
}

#scene {
  display: none;
  position: relative;
  width: 100%;
}

#hand {
  font-size: 150px;
  opacity: 0;
  filter: grayscale(1);
}

#hand.show {
  animation: handAppear 2.5s ease forwards;
}

#finger {
  display: none;
  font-size: 180px;
  margin-top: 10px;
  filter: grayscale(1);
}

#finger.show {
  display: block;
  animation: fingerReveal .8s cubic-bezier(.15,.8,.25,1.4) forwards;
}

#message {
  opacity: 0;
  margin-top: 25px;
  font-size: 15px;
  letter-spacing: 6px;
  color: #aaa;
}

#message.show {
  animation: textAppear 1.5s ease forwards;
}

.flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

.flash.active {
  animation: flash .4s ease;
}

@keyframes handAppear {
  0% {
    opacity: 0;
    transform: translateY(100px) scale(.5);
  }
  60% {
    opacity: .7;
    transform: translateY(-8px) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes fingerReveal {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(-40deg);
  }
  65% {
    opacity: 1;
    transform: scale(1.25) rotate(8deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

@keyframes textAppear {
  to {
    opacity: 1;
  }
}

@keyframes flash {
  0% { opacity: 0; }
  30% { opacity: .9; }
  100% { opacity: 0; }
}

body.prank {
  animation: darkness 2s forwards;
}

@keyframes darkness {
  to { background: #030000; }
}
</style>
</head>

<body>

<div id="screen">
  <div id="intro">
    <h1>ARE YOU READY?</h1>
    <p class="subtitle">THINK BEFORE YOU CONTINUE</p>
    <button onclick="startPrank()">BEGIN</button>
  </div>

  <div id="scene">
    <h1 id="heading">PLEASE WAIT...</h1>

    <div id="hand">✋</div>

    <div id="finger">🖕</div>

    <div id="message">YOU HAVE BEEN WARNED.</div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
function startPrank() {
  document.body.classList.add("prank");

  document.getElementById("intro").style.display = "none";
  document.getElementById("scene").style.display = "block";

  const hand = document.getElementById("hand");
  const finger = document.getElementById("finger");
  const heading = document.getElementById("heading");
  const message = document.getElementById("message");

  heading.textContent = "IDENTIFYING...";
  hand.classList.add("show");

  setTimeout(() => {
    heading.textContent = "SCANNING COMPLETE";
  }, 1800);

  setTimeout(() => {
    heading.style.display = "none";
    hand.style.display = "none";

    document.getElementById("flash").classList.add("active");
    finger.classList.add("show");
  }, 3500);

  setTimeout(() => {
    message.classList.add("show");
  }, 4400);
}
</script>

</body>
</html>
